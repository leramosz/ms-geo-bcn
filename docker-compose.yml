services:
  postgis:
    image: postgis/postgis:16-3.5
    # La imagen oficial solo publica amd64: en Apple Silicon corre con emulación (Rosetta).
    platform: linux/amd64
    container_name: geo-bcn-postgis
    environment:
      POSTGRES_DB: geobcn
      POSTGRES_USER: geobcn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geobcn}   # solo para desarrollo local
    ports:
      - "5432:5432"
    volumes:
      - ./db:/geo-bcn/db:ro
      - ./db/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - geo-bcn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geobcn -d geobcn"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  geo-bcn-pgdata:
